name: Validate CLR implementation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-resource-controls504:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ERLC_USE_SERVER: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Select changed resource-control inputs
        id: resource-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ.get('BASE_SHA', '')
          present = bool(base and set(base) != {'0'} and subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], capture_output=True).returncode == 0)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() if present else []
          prefixes = ('tools/Runtime/Erlang.ResourceControls504Observations/', 'tools/Runtime/Erlang.SchedulerAffinityOriginalObservations/', 'src/Runtime/Erlang.Runtime.Core/Scheduling/', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.Statistics', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.SchedulerStatistics', 'src/Runtime/Erlang.Runtime.Core/Diagnostics/Tracing/SequenceTraceRegistrations')
          selected = [name for name in changed if name.startswith(prefixes) or 'SystemFlag504' in name or name == '.github/workflows/validate.yml']
          required = not present or bool(selected)
          folder = pathlib.Path('artifacts/resource-controls504-original')
          folder.mkdir(parents=True)
          (folder / 'scope.json').write_text(json.dumps(dict(Required=required, BaseAvailable=present, Base=base, SelectedPaths=selected, OriginalExecutionClaimed=False), indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(required).lower() + '\n')
          PY
      - name: Prepare one pinned original runtime for the whole resource batch
        if: steps.resource-scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resource-controls504-original
          git clone --depth 1 --single-branch --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/resource-controls504-otp-source > artifacts/resource-controls504-original/clone.log 2>&1
          test "$(git -C artifacts/resource-controls504-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
          python3 -B tools/Runtime/Erlang.SchedulerAffinityOriginalObservations/build-original.py \
            --repository "$GITHUB_WORKSPACE" --manifest-sha256 AEBBA0D2DCF97E1248CA38407E8EBE628EB08F9EA4D13F48EC0C83A7A0364E61 \
            --expected-head "$GITHUB_SHA" --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --prefix "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build" \
            > artifacts/resource-controls504-original/runtime-build.log 2>&1
      - name: Capture all independent original queue and flag cases
        if: steps.resource-scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build/build-receipt.json"
          receipt_sha=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.ResourceControls504Observations/collect.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$GITHUB_SHA" \
            --plan-sha256 65DFD908AB37416665DEB9BA988B315BAFAB27DC2FEA8F3A7802156D7A62582C \
            --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --otp-install "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp/lib/erlang" \
            --build-receipt "$receipt" --build-receipt-sha256 "$receipt_sha" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/capture" \
            > artifacts/resource-controls504-original/capture.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-resource-controls504
          path: artifacts/resource-controls504-original/**
  relocated-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify actual relocated observer imports and workflow paths
        run: |
          mkdir -p artifacts/review498
          python3 -B tools/Validation/ReviewFollowup498/check-tool-paths.py > artifacts/review498/tool-paths-linux.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relocated-tooling
          path: artifacts/review498/**
  local-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          $runtimes = dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft.NETCore.App 10\.0\.11 ')) { throw 'Required source-admitted test CLR 10.0.11 is missing' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $runtimes | Set-Content artifacts/runtime-profile.log
          ./tools/prepare-regex-provider.ps1 -Repository $PWD.Path
      - shell: pwsh
        run: |
          $originalFailures = @()
          $PSNativeCommandUseErrorActionPreference = $false
          python -B tools/Native/Erlang.DdllFormatterOriginalObservations/collect-same-host.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/library437-ddll-same-host-original1
          if ($LASTEXITCODE -ne 0) {
            $originalFailures += 'Same-host original formatter capture failed'
          } else {
            $proof = Join-Path $PWD.Path 'artifacts/library437-ddll-same-host-original1/completion.json'
            "ERLANG_DDLL_FORMATTER_ORIGINAL_PROFILE=$proof" | Add-Content $env:GITHUB_ENV
            "ERLANG_DDLL_FORMATTER_ORIGINAL_PROFILE_SHA256=$((Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash)" | Add-Content $env:GITHUB_ENV
          }
          python -B tools/Collections/Erlang.EtsCompressedOriginalObservations442/collect-same-host.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/library442-ets-same-host-original1
          if ($LASTEXITCODE -ne 0) { $originalFailures += 'Same-host original ETS442 capture failed' }
          if ($originalFailures.Count -ne 0) { throw ($originalFailures -join '; ') }
      - name: Compare BIF contract re-audit with same-host pinned OTP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $contractFailures = @()
          foreach ($fixtureName in @('ContractReaudit487', 'NumericContract487', 'TupleContract488', 'ProcessLiveness499', 'ProcessRetirement500', 'NodeContract501', 'NodeIdentity501', 'NativeConnection501')) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture "tests/Erlang.Tests/Resources/$fixtureName" --output "artifacts/contracts487/ci-original/$fixtureName" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original contract acquisition failed: $fixtureName" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/TupleMutation489/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/TupleMutation489 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts489/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original tuple acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/OperatorContract490/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/OperatorContract490 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts490/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original operator acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/ArithmeticContract491/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/ArithmeticContract491 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts491/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original arithmetic acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/AtomContract492/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/AtomContract492 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts492/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/IntegerContract493/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/IntegerContract493 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts493/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original integer text acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/MapContract495/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/MapContract495 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts495/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original map BIF acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/RecordContract496/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/RecordContract496 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts496/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original record BIF acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/BuiltinContract497/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/BuiltinContract497 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts497/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original builtin BIF acquisition failed: $($group.Group)" }
          }
          python -B tools/Validation/AtomContract492/observe-capacity-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/contracts492/ci-capacity
          if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom-capacity observation failed" }
          foreach ($creator in @('list', 'binary', 'encoded')) {
            python -B tools/Validation/AtomContract494/observe-capacity-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --creator $creator --output "artifacts/contracts494/ci-capacity/$creator"
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom-capacity route failed: $creator" }
          }
          if ($contractFailures.Count -ne 0) { throw ($contractFailures -join '; ') }
      - shell: pwsh
        run: ./tools/validate.ps1 -TestRuntimeVersion 10.0.11
      - name: Compare native empty-map creation with pinned OTP and both loaders
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path tools/Native/Erlang.NifNativeBackend/bin/Debug/net10.0/Erlang.NifNativeBackend.dll) -or !(Test-Path artifacts/library376-official-compiler/official-admission.json)) {
            throw 'Native map501 requires successful host/provider preparation; dependent native execution was not started'
          }
          python -B tools/Native/Erlang.NifMapCreation501Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 3E2BAFD2AB62E8588434C07C3CD341D9E429333C6AF4F7916E4D2279D9954579 --output artifacts/native-map501/ci --runtime-version 10.0.11 --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Native map501 original/ordinary/reviewed comparison failed; inspect all phase receipts' }
      - name: Compare native map lookup with pinned OTP and both loaders
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/library376-official-compiler/official-admission.json)) { throw 'Map lookup503 preparation unavailable; dependent native execution was not started.' }
          python -B tools/Native/Erlang.NifMapValue503Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 D1A9BE80F21C40E7FD8D84489401BF18F673EA14A5A383FB0170C11766EA204A --output artifacts/native-map503/ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Native map lookup503 comparison failed; independent route results are retained.' }
      - name: Compare the complete native map family with pinned OTP and both loaders
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path tools/Native/Erlang.NifNativeBackend/bin/Debug/net10.0/Erlang.NifNativeBackend.dll) -or !(Test-Path artifacts/library376-official-compiler/official-admission.json)) {
            throw 'Map family504 requires successful host/provider preparation; dependent execution was not started'
          }
          python -B tools/Native/Erlang.NifMapFamily504Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 D0F1BB1E678627E19685EFF5E77A064C2EB90CB35ECB250E09166CF26407A9A3 --output artifacts/native-map504/ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Native map family504 original/ordinary/reviewed comparison failed; all prepared independent route receipts are retained' }
      - name: Compare source-exact function collision protocol with pinned OTP
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/library376-official-compiler/official-admission.json)) { throw 'Collision504 provider preparation missing; dependent execution skipped' }
          python -B tools/Native/Erlang.NifMapCollision504Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 1E9AFD3B7D49E6EB0D8B30C09C91C718821360533C610D87A62CBE8C056FFAC4 --output artifacts/native-map504/collision-ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Source-exact collision504 original/ordinary/reviewed comparison failed' }
      - name: Compare materialized native maps after return with pinned OTP
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path tools/Native/Erlang.NifNativeBackend/bin/Debug/net10.0/Erlang.NifNativeBackend.dll) -or !(Test-Path artifacts/library376-official-compiler/official-admission.json)) {
            throw 'Materialized505 host/provider preparation missing; dependent execution skipped'
          }
          python -B tools/Native/Erlang.NifMapMaterialized505Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 48B09FAA35E224DBCF152E8CCBB9332D5DB6CF917B49F9EDB6229BBA3659BF62 --output artifacts/native-map505/ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Materialized505 independent original/ordinary/reviewed comparison failed; inspect retained full results' }
      - name: Compare duplicate flat-map native reentry with pinned OTP
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path tools/Native/Erlang.NifNativeBackend/bin/Debug/net10.0/Erlang.NifNativeBackend.dll) -or !(Test-Path artifacts/library376-official-compiler/official-admission.json)) {
            throw 'Reentry505 host/provider preparation missing; dependent execution skipped'
          }
          python -B tools/Native/Erlang.NifMapReentry505Observations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 2DBFC0CBBF1946D5944738CF48DB2BD04143F95DD7DAEB6A7F6F970640460FD7 --output artifacts/native-map505/reentry-ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Reentry505 original/ordinary/reviewed comparison failed; independent routes and cleanup retained' }
      - name: Verify logical death before physical dirty completion in pinned OTP
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/library376-official-compiler/official-admission.json)) {
            throw 'Retirement502 requires successful original-provider preparation; dependent native execution was not started'
          }
          python -B tools/Native/Erlang.ProcessRetirement502OriginalObservations/collect.py --repository $PWD.Path --provider-admission artifacts/library376-official-compiler/official-admission.json --plan-sha256 63171EAC39BEF4AD0DEBE1F4CD09241EA6C4F6967CB8FABBCC638D6F540B7B76 --output artifacts/process-retirement502/ci --check-golden
          if ($LASTEXITCODE -ne 0) { throw 'Retirement502 controlled original protocol failed; inspect native markers and owned-process receipt' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            artifacts/tests.json
            artifacts/native-map501/ci/**
            artifacts/process-retirement502/ci/**
            artifacts/native-map503/ci/**
            artifacts/native-map505/ci/**
            artifacts/native-map505/reentry-ci/**
            artifacts/native-map504/ci/**
            artifacts/native-map504/collision-ci/**
            artifacts/contracts487/ci-original/**
            artifacts/contracts489/ci-original/**
            artifacts/contracts490/ci-original/**
            artifacts/contracts491/ci-original/**
            artifacts/contracts492/ci-original/**
            artifacts/contracts493/ci-original/**
            artifacts/contracts495/ci-original/**
            artifacts/contracts496/ci-original/**
            artifacts/contracts497/ci-original/**
            artifacts/contracts492/ci-capacity/**
            artifacts/contracts494/ci-capacity/**
