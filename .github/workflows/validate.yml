name: Validate CLR implementation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-resource-controls504:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      ERLC_USE_SERVER: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select changed resource-control inputs
        id: resource-scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = os.environ.get('BASE_SHA', '')
          present = bool(base and set(base) != {'0'} and subprocess.run(['git', 'cat-file', '-e', base + '^{commit}'], capture_output=True).returncode == 0)
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines() if present else []
          prefixes = ('src/Runtime/Erlang.Runtime.Core/Storage/RuntimeAtomics', 'src/Runtime/Erlang.Runtime.Core/Processes/ProcessRuntime.cs', 'src/Runtime/Erlang.Runtime.Core/Storage/Atomics', 'src/Runtime/Erlang.Runtime.Core/Services/RuntimeReferenceResources', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.Atomics', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessContext.Atomics', 'src/Runtime/Erlang.Runtime.Core/Primitives/References/ResourceReferenceTerm.cs', 'tests/Erlang.Tests/Runtime/Storage/Atomics/', 'tests/Erlang.Tests/Runtime/Memory/OriginalAtomics', 'tools/Runtime/Erlang.DynamicApply520Observations/', 'tests/Erlang.Tests/Compiler/Beam/Calls/DynamicApply', 'tools/Runtime/Erlang.OwnedGuest506Observations/', 'tests/Erlang.Tests/Runtime/Memory/Owned', 'src/Runtime/Erlang.Runtime.Core/Processes/Memory/', 'src/Runtime/Erlang.Runtime.Core/Execution/Beam/', 'tools/Runtime/Erlang.ResourceControls504Observations/', 'tools/Runtime/Erlang.SchedulerAffinityOriginalObservations/', 'src/Runtime/Erlang.Runtime.Core/Scheduling/', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.Statistics', 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.SchedulerStatistics', 'src/Runtime/Erlang.Runtime.Core/Diagnostics/Tracing/SequenceTraceRegistrations')
          selected = [name for name in changed if name.startswith(prefixes) or 'SystemFlag504' in name or 'Owned' in name or name == '.github/workflows/validate.yml']
          required = not present or bool(selected)
          folder = pathlib.Path('artifacts/resource-controls504-original')
          folder.mkdir(parents=True)
          (folder / 'scope.json').write_text(json.dumps(dict(Required=required, BaseAvailable=present, Base=base, SelectedPaths=selected, OriginalExecutionClaimed=False), indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('required=' + str(required).lower() + '\n')
          PY
      - name: Admit reviewed committed owned506 plan at the exact source head
        id: owned506-admit
        if: steps.resource-scope.outputs.required == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          plan_sha=$(git show "$EXPECTED_HEAD:tools/Runtime/Erlang.OwnedGuest506Observations/source-plan.json" | sha256sum | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.OwnedGuest506Observations/collect.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" --plan-sha256 "$plan_sha" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/owned506-prepare" \
            > artifacts/resource-controls504-original/owned506-source-admission.log 2>&1
          echo "OWNED506_PLAN_SHA=$plan_sha" >> "$GITHUB_ENV"
      - name: Prepare one pinned original runtime for the whole resource batch
        id: shared-original-build
        if: steps.resource-scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/resource-controls504-original
          git clone --depth 1 --single-branch --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/resource-controls504-otp-source > artifacts/resource-controls504-original/clone.log 2>&1
          test "$(git -C artifacts/resource-controls504-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
          python3 -B tools/Runtime/Erlang.SchedulerAffinityOriginalObservations/build-original.py \
            --repository "$GITHUB_WORKSPACE" --manifest-sha256 AEBBA0D2DCF97E1248CA38407E8EBE628EB08F9EA4D13F48EC0C83A7A0364E61 \
            --expected-head "$EXPECTED_HEAD" --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --prefix "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build" \
            > artifacts/resource-controls504-original/runtime-build.log 2>&1
      - name: Capture all independent original queue and flag cases
        if: steps.resource-scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build/build-receipt.json"
          receipt_sha=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.ResourceControls504Observations/collect.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" \
            --plan-sha256 65DFD908AB37416665DEB9BA988B315BAFAB27DC2FEA8F3A7802156D7A62582C \
            --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --otp-install "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp/lib/erlang" \
            --build-receipt "$receipt" --build-receipt-sha256 "$receipt_sha" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/capture" \
            > artifacts/resource-controls504-original/capture.log 2>&1
      - name: Reuse the same original Linux installation for all six owned506 jobs
        id: owned506-original
        if: ${{ !cancelled() && steps.resource-scope.outputs.required == 'true' && steps.shared-original-build.outcome == 'success' && steps.owned506-admit.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build/build-receipt.json"
          receipt_sha=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.OwnedGuest506Observations/collect.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" --plan-sha256 "$OWNED506_PLAN_SHA" \
            --build-receipt "$receipt" --admission-sha256 "$receipt_sha" \
            --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --output "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/owned506-capture" \
            --execute-original --check-paired-golden \
            > artifacts/resource-controls504-original/owned506-capture.log 2>&1
      - uses: actions/setup-dotnet@v6
        id: owned506-sdk
        if: ${{ !cancelled() && steps.owned506-admit.outcome == 'success' }}
        with:
          global-json-file: global.json
      - name: Build the shared managed Linux test host once
        id: managed-linux-build
        if: ${{ !cancelled() && steps.owned506-sdk.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tests/Erlang.Tests/Erlang.Tests.csproj -c Release -m:1 > artifacts/resource-controls504-original/shared-managed-build.log 2>&1
      - name: Verify final-source owned506 observer and sender controls on Linux
        id: owned506-controls
        if: ${{ !cancelled() && steps.managed-linux-build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet exec --fx-version 10.0.11 tests/Erlang.Tests/bin/Release/net10.0/Erlang.Tests.dll \
            --case runtime/owned-guest506/original-compiled-worker-whole-values-and-stacks \
            --case runtime/owned-guest506/source-message-survives-sender-physical-retirement \
            --case runtime/owned-guest506/nested-foreign-invocation-refuses-enclosing-vm-shutdown \
            --case runtime/boxed-float556/actual-slab-getter-and-major-gc \
            --case runtime/boxed-float556/adoption-marker-and-root-only-custody \
            --case runtime/boxed-float556/foreign-rejection-and-held-retirement \
            --case runtime/boxed-integer559/actual-slab-getter-and-major-gc \
            --case runtime/boxed-integer559/adoption-marker-and-root-only-custody \
            --case runtime/boxed-integer559/foreign-rejection-and-held-retirement \
            --case runtime/boxed-integer559/nested-immediates-import-and-adoption \
            --report artifacts/resource-controls504-original/owned506-final-controls.json \
            > artifacts/resource-controls504-original/owned506-final-controls.log 2>&1
      - name: Capture fresh dynamic520 whole contracts using the shared Linux OTP
        id: dynamic520-original
        if: ${{ !cancelled() && steps.shared-original-build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          receipt="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build/build-receipt.json"
          plan_sha=$(sha256sum tools/Runtime/Erlang.DynamicApply520Observations/source-plan.json | cut -d ' ' -f 1)
          receipt_sha=$(sha256sum "$receipt" | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.DynamicApply520Observations/collect-original.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" --plan-sha256 "$plan_sha" \
            --build-receipt "$receipt" --admission-sha256 "$receipt_sha" \
            --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --output artifacts/resource-controls504-original/dynamic520-original --execute-original \
            > artifacts/resource-controls504-original/dynamic520-original.log 2>&1
      - name: Compare both final-source dynamic520 profiles with Linux OTP
        id: dynamic520-controls
        if: ${{ !cancelled() && steps.dynamic520-original.outcome == 'success' && steps.managed-linux-build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          completion="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/dynamic520-original/completion.json"
          completion_sha=$(sha256sum "$completion" | cut -d ' ' -f 1)
          status=0
          for owned in false true; do
            if ! dotnet exec --fx-version 10.0.11 tests/Erlang.Tests/bin/Release/net10.0/Erlang.Tests.dll --dynamic-apply-boundary520-child \
              "$GITHUB_WORKSPACE" "$completion" "$completion_sha" "$owned" \
              "$GITHUB_WORKSPACE/artifacts/resource-controls504-original/dynamic520-managed-$owned" \
              > "artifacts/resource-controls504-original/dynamic520-managed-$owned.log" 2>&1; then status=1; fi
          done
          exit "$status"
      - name: Compare atomics and original counters with the shared Linux OTP
        id: atomics592-contracts
        if: ${{ !cancelled() && steps.resource-scope.outputs.required == 'true' && steps.shared-original-build.outcome == 'success' && steps.managed-linux-build.outcome == 'success' && steps.owned506-admit.outcome == 'success' && steps.dynamic520-original.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          provider="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/runtime-build/build-receipt.json"
          provider_sha=$(sha256sum "$provider" | cut -d ' ' -f 1)
          metadata="$GITHUB_WORKSPACE/artifacts/resource-controls504-original/dynamic520-original/completion.json"
          metadata_sha=$(sha256sum "$metadata" | cut -d ' ' -f 1)
          host="$GITHUB_WORKSPACE/tests/Erlang.Tests/bin/Release/net10.0/Erlang.Tests.dll"
          host_sha=$(sha256sum "$host" | cut -d ' ' -f 1)
          python3 -B tools/Runtime/Erlang.OwnedGuest506Observations/capture-atomics588.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" --source-plan-sha256 "$OWNED506_PLAN_SHA" \
            --build-receipt "$provider" --otp-source "$GITHUB_WORKSPACE/artifacts/resource-controls504-otp-source" \
            --admission-sha256 "$provider_sha" --output artifacts/resource-controls504-original/atomics592 \
            --managed-host "$host" --managed-host-sha256 "$host_sha" --metadata-completion "$metadata" \
            --metadata-completion-sha256 "$metadata_sha" --own-reference-protocol \
            > artifacts/resource-controls504-original/atomics592.log 2>&1
      - name: Require every owned506 original and final-control stage
        if: ${{ !cancelled() && steps.resource-scope.outputs.required == 'true' }}
        shell: bash
        env:
          ADMISSION: ${{ steps.owned506-admit.outcome }}
          ORIGINAL: ${{ steps.owned506-original.outcome }}
          BUILD: ${{ steps.managed-linux-build.outcome }}
          CONTROLS: ${{ steps.owned506-controls.outcome }}
          DYNAMIC_ORIGINAL: ${{ steps.dynamic520-original.outcome }}
          DYNAMIC_CONTROLS: ${{ steps.dynamic520-controls.outcome }}
          ATOMICS_CONTRACTS: ${{ steps.atomics592-contracts.outcome }}
        run: |
          test "$ADMISSION" = success
          test "$ORIGINAL" = success
          test "$BUILD" = success
          test "$CONTROLS" = success
          test "$DYNAMIC_ORIGINAL" = success
          test "$DYNAMIC_CONTROLS" = success
          test "$ATOMICS_CONTRACTS" = success
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-resource-controls504
          path: artifacts/resource-controls504-original/**
  relocated-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify actual relocated observer imports and workflow paths
        run: |
          mkdir -p artifacts/review498
          python3 -B tools/Validation/ReviewFollowup498/check-tool-paths.py > artifacts/review498/tool-paths-linux.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: relocated-tooling
          path: artifacts/review498/**
  local-regressions:
    runs-on: windows-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check all eight native source-plan byte bindings before regression
        shell: python
        run: |
          """Passive source binding checks only: never calls a collector main/build/VM."""
          import argparse
          import hashlib
          import importlib.util
          import json
          import os
          from pathlib import Path
          import re
          import sys

          sys.dont_write_bytecode = True
          PIN = "ad05823719d77c8faee87348ea39513d4e2f99c5"
          NATIVE = "tools/Native/"
          OWNED = "tools/Runtime/Erlang.OwnedGuest506Observations"
          LEGACY = ["Erlang.NifMapFamily504Observations", "Erlang.NifMapMaterialized505Observations",
                    "Erlang.NifMapReentry505Observations"]


          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest().upper()


          def require(value, message):
              if not value:
                  raise ValueError(message)


          def module(path, name):
              spec = importlib.util.spec_from_file_location(name, path)
              loaded = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(loaded)
              return loaded


          def plan(root, relative):
              path = root / relative
              value = json.loads(path.read_bytes())
              require(value.get("PinnedCommit", value.get("PinnedOtpCommit")) == PIN, "Wrong source pin")
              return path, value


          def native(root, name, workflow):
              tool = root / NATIVE / name
              path, value = plan(root, NATIVE + name + "/source-plan.json")
              lines = [line for line in workflow.splitlines() if NATIVE + name + "/collect.py" in line]
              require(len(lines) == 1, "One exact workflow collector invocation required")
              match = re.search(r"--plan-sha256 ([0-9A-F]{64})", lines[0])
              require(match is not None and match.group(1) == digest(path), "Workflow source-plan pin differs")
              collector = module(tool / "collect.py", "preflight_" + name.replace(".", "_"))
              if name == LEGACY[1]:
                  rows = collector.sources(root, tool, value)
              elif name == LEGACY[2]:
                  rows = collector.dependencies(root, value, False)
              else:
                  rows = collector.dependencies(root, value)
              for prefix, filename in [("NativeSource", None), ("ErlangSource", None),
                                       ("BuildScript", "build-native.py"), ("Collector", "collect.py")]:
                  source = tool / filename if filename else root / value[prefix + "Path"]
                  require(digest(source) == value[prefix + "Sha256"], "Tool source seal differs: " + str(source))
              if "SealerSha256" in value:
                  require(digest(tool / "seal.py") == value["SealerSha256"], "Sealer source differs")
              # Whole owner/env partial membership, including newly added partials.
              paths = {row["Path"] for row in value["Dependencies"]}
              folder = root / "src/Runtime/Erlang.Runtime.Core/Native/Nif"
              required = {p.relative_to(root).as_posix() for pattern in
                          ["NifNativeLibraryOwner*.cs", "NifNativeCallEnvironment*.cs"] for p in folder.glob(pattern)}
              require(required.issubset(paths), "Unbound owner/environment partials: " + str(sorted(required - paths)))
              return dict(PlanSha256=digest(path), VerifiedRows=len(rows), NativeExecuted=False)


          def pending(root):
              relative = NATIVE + "Erlang.NifPendingVarargsObservations"
              path, value = plan(root, relative + "/reviewed-source-plan.json")
              workflow = (root / ".github/workflows/nif-pending-native.yml").read_text(encoding="utf-8-sig")
              match = re.search(r"REVIEWED_SOURCE_PLAN_SHA256: ([0-9A-F]{64})", workflow)
              require(match is not None and match.group(1) == digest(path), "Pending workflow pin differs")
              helper = module(root / relative / "run-reviewed.py", "preflight_pending")
              names = set()
              for row in value["Files"]:
                  require(row["Path"] not in names, "Duplicate pending source")
                  names.add(row["Path"])
                  source = (root / row["Path"]).resolve()
                  require(source.is_relative_to(root), "Pending source escapes repository")
                  actual = helper.record(source, root, row["HashMode"])
                  actual["Path"] = actual["Path"].replace("\\", "/")
                  require(actual == row, "Pending source differs: " + row["Path"])
              # reviewed_inputs invokes git membership enumeration: deliberately not called
              # by this byte-only preflight. The existing native execution gate keeps it.
              return dict(PlanSha256=digest(path), VerifiedRows=len(names), CompleteGitMembershipChecked=False)


          def reallocation(root):
              relative = NATIVE + "Erlang.NifReallocationObservations"
              path, _ = plan(root, relative + "/SOURCE-PLAN.json")
              workflow = (root / ".github/workflows/nif-reallocation-native.yml").read_text(encoding="utf-8-sig")
              match = re.search(r"REVIEWED_REALLOCATION_PLAN_SHA256: ([0-9A-F]{64})", workflow)
              require(match is not None and match.group(1) == digest(path), "Reallocation workflow pin differs")
              helper = module(root / relative / "reviewed_common.py", "preflight_reallocation")
              value = helper.verified_plan(root, path, match.group(1))
              return dict(PlanSha256=digest(path), VerifiedRows=len(value["Files"]))


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--repository", type=Path, default=Path(os.environ.get("GITHUB_WORKSPACE", ".")))
              parser.add_argument("--output", type=Path, default=Path("artifacts/source-plan566/preflight.json"))
              args = parser.parse_args()
              root = args.repository.resolve()
              output = args.output.resolve() if args.output.is_absolute() else root / args.output
              require(output.resolve().is_relative_to(root / "artifacts") and not output.exists(), "Fresh artifact output required")
              owned = module(root / OWNED / "collect.py", "preflight_owned506")
              workflow = (root / ".github/workflows/validate.yml").read_text(encoding="utf-8-sig")
              checks = [(name, lambda name=name: native(root, name, workflow)) for name in LEGACY]
              for relative in [OWNED, NATIVE + "Erlang.NifVariadic526Observations"]:
                  def inputs(relative=relative):
                      path, value = plan(root, relative + "/source-plan.json")
                      owned.check_inputs(root, root / relative, value)
                      return dict(PlanSha256=digest(path), VerifiedRows=len(value["Inputs"]))
                  checks.append((relative, inputs))
              checks.extend([("Pending", lambda: pending(root)), ("Reallocation", lambda: reallocation(root))])
              def private():
                  relative = NATIVE + "Erlang.NifPrivateData557Observations"
                  path, _ = plan(root, relative + "/source-plan.json")
                  evidence = module(root / relative / "evidence.py", "preflight_private557")
                  files = evidence.package(root, root / relative, digest(path))
                  return dict(PlanSha256=digest(path), VerifiedFiles=len(files))
              checks.append(("Private557", private))
              outcomes = []
              for name, check in checks:
                  try:
                      outcomes.append(dict(Plan=name, Passed=True, Details=check()))
                  except Exception as error:
                      outcomes.append(dict(Plan=name, Passed=False, Error=repr(error)))
              passed = all(row["Passed"] for row in outcomes)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes((json.dumps(dict(Passed=passed, Checks=outcomes, ExpectedPlans=8,
                  BuildOrVmExecuted=False, NativeExecuted=False, SourceHeadAuthenticityClaimed=False,
                  FullSourceMembershipClaimed=False, WholeContractsClosed=0), indent=2) + "\n").encode())
              require(passed, "Source-plan consistency failed; all independent results retained")


          if __name__ == "__main__":
              main()
      - name: Admit reviewed committed owned506 plan at the exact source head
        id: owned506-admit
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path artifacts/owned506 -Force | Out-Null
          $actualHead = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualHead -ne $env:EXPECTED_HEAD) { throw 'Exact source head differs' }
          $planSha = python -c "import hashlib,subprocess,sys; print(hashlib.sha256(subprocess.check_output(['git','show',sys.argv[1]+':tools/Runtime/Erlang.OwnedGuest506Observations/source-plan.json'])).hexdigest().upper())" $env:EXPECTED_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Committed source plan could not be read' }
          python -B tools/Runtime/Erlang.OwnedGuest506Observations/collect.py --repository $PWD.Path --expected-head $env:EXPECTED_HEAD --plan-sha256 $planSha --output artifacts/owned506/prepare *> artifacts/owned506/source-admission.log
          if ($LASTEXITCODE -ne 0) { throw 'Owned506 sealed source admission failed' }
          "OWNED506_PLAN_SHA=$planSha" | Add-Content $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        id: shared-original-provider
        run: |
          $runtimes = dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft.NETCore.App 10\.0\.11 ')) { throw 'Required source-admitted test CLR 10.0.11 is missing' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $runtimes | Set-Content artifacts/runtime-profile.log
          ./tools/prepare-regex-provider.ps1 -Repository $PWD.Path
      - name: Reuse admitted Windows provider for all six owned506 jobs
        id: owned506-original
        if: ${{ !cancelled() && steps.shared-original-provider.outcome == 'success' && steps.owned506-admit.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $admission = 'artifacts/library376-official-compiler/official-admission.json'
          $admissionSha = (Get-FileHash -LiteralPath $admission -Algorithm SHA256).Hash
          python -B tools/Runtime/Erlang.OwnedGuest506Observations/collect.py --repository $PWD.Path --expected-head $env:EXPECTED_HEAD --plan-sha256 $env:OWNED506_PLAN_SHA --official-admission $admission --admission-sha256 $admissionSha --output artifacts/owned506/capture --execute-original --check-paired-golden *> artifacts/owned506/capture.log
          if ($LASTEXITCODE -ne 0) { throw 'Owned506 independent original jobs failed; all raw receipts retained' }
      - shell: pwsh
        run: |
          $originalFailures = @()
