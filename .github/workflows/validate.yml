name: Validate CLR implementation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: ./tools/validate.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            artifacts/tests.json
            artifacts/integration-results.json
            artifacts/preprocessing-disabled.log
