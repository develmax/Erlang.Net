name: Validate CLR implementation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  local-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - shell: pwsh
        run: |
          $runtimes = dotnet --list-runtimes
          if ($LASTEXITCODE -ne 0 -or -not ($runtimes -match '^Microsoft.NETCore.App 10\.0\.11 ')) { throw 'Required source-admitted test CLR 10.0.11 is missing' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $runtimes | Set-Content artifacts/runtime-profile.log
          ./tools/prepare-regex-provider.ps1 -Repository $PWD.Path
      - shell: pwsh
        run: |
          $originalFailures = @()
          $PSNativeCommandUseErrorActionPreference = $false
          python -B tools/Native/Erlang.DdllFormatterOriginalObservations/collect-same-host.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/library437-ddll-same-host-original1
          if ($LASTEXITCODE -ne 0) {
            $originalFailures += 'Same-host original formatter capture failed'
          } else {
            $proof = Join-Path $PWD.Path 'artifacts/library437-ddll-same-host-original1/completion.json'
            "ERLANG_DDLL_FORMATTER_ORIGINAL_PROFILE=$proof" | Add-Content $env:GITHUB_ENV
            "ERLANG_DDLL_FORMATTER_ORIGINAL_PROFILE_SHA256=$((Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash)" | Add-Content $env:GITHUB_ENV
          }
          python -B tools/Collections/Erlang.EtsCompressedOriginalObservations442/collect-same-host.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/library442-ets-same-host-original1
          if ($LASTEXITCODE -ne 0) { $originalFailures += 'Same-host original ETS442 capture failed' }
          if ($originalFailures.Count -ne 0) { throw ($originalFailures -join '; ') }
      - name: Compare BIF contract re-audit with same-host pinned OTP
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $contractFailures = @()
          foreach ($fixtureName in @('ContractReaudit487', 'NumericContract487', 'TupleContract488')) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture "tests/Erlang.Tests/Resources/$fixtureName" --output "artifacts/contracts487/ci-original/$fixtureName" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original contract acquisition failed: $fixtureName" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/TupleMutation489/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/TupleMutation489 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts489/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original tuple acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/OperatorContract490/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/OperatorContract490 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts490/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original operator acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/ArithmeticContract491/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/ArithmeticContract491 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts491/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original arithmetic acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/AtomContract492/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/AtomContract492 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts492/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom acquisition failed: $($group.Group)" }
          }
          foreach ($group in (Get-Content tests/Erlang.Tests/Resources/IntegerContract493/groups.json -Raw | ConvertFrom-Json)) {
            python -B tools/Validation/ContractReaudit487/collect-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --fixture tests/Erlang.Tests/Resources/IntegerContract493 --subject $group.Subject --golden-prefix "$($group.Group)." --output "artifacts/contracts493/ci-original/$($group.Group)" --check-golden
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original integer text acquisition failed: $($group.Group)" }
          }
          python -B tools/Validation/AtomContract492/observe-capacity-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --output artifacts/contracts492/ci-capacity
          if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom-capacity observation failed" }
          foreach ($creator in @('list', 'binary', 'encoded')) {
            python -B tools/Validation/AtomContract494/observe-capacity-original.py --repository $PWD.Path --admission artifacts/library376-official-compiler/official-admission.json --creator $creator --output "artifacts/contracts494/ci-capacity/$creator"
            if ($LASTEXITCODE -ne 0) { $contractFailures += "Original atom-capacity route failed: $creator" }
          }
          if ($contractFailures.Count -ne 0) { throw ($contractFailures -join '; ') }
      - shell: pwsh
        run: ./tools/validate.ps1 -TestRuntimeVersion 10.0.11
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            artifacts/tests.json
            artifacts/contracts487/ci-original/**
            artifacts/contracts489/ci-original/**
            artifacts/contracts490/ci-original/**
            artifacts/contracts491/ci-original/**
            artifacts/contracts492/ci-original/**
            artifacts/contracts493/ci-original/**
            artifacts/contracts492/ci-capacity/**
            artifacts/contracts494/ci-capacity/**
            artifacts/library485/permanent/**
            artifacts/library485/catalog/**/results/**
            artifacts/library485/catalog/**/native/compile*.txt
            artifacts/library485/catalog/**/native/compile.json
            artifacts/library485/catalog/latest.json
            artifacts/library485/catalog/latest-run.json
            artifacts/library485/cold-catalog/**/results/**
            artifacts/library485/cold-catalog/**/completion.json
            artifacts/otp-regex-captures-original/**
            artifacts/integration-results.json
            artifacts/otp-kernel-original/**
            artifacts/otp-kernel-values.txt
            artifacts/otp-boot-original/**
            artifacts/otp-boot-managed/**
            artifacts/otp-syntax-original/**
            artifacts/otp-syntax-managed/**
            artifacts/otp-compiler-original/**
            artifacts/otp-compiler-managed/**
            artifacts/otp-tools-original/**
            artifacts/otp-tools-managed/**
            artifacts/otp-documentation-original/**
            artifacts/otp-documentation-managed/**
            artifacts/otp-mnesia-original/**
            artifacts/otp-mnesia-managed/**
            artifacts/otp-asn1-original/**
            artifacts/otp-asn1-managed/**
            artifacts/otp-security-original/**
            artifacts/otp-security-managed/**
            artifacts/otp-transport-original/**
            artifacts/otp-transport-managed/**
            artifacts/otp-network-original/**
            artifacts/otp-network-managed/**
            artifacts/otp-management-original/**
            artifacts/otp-management-managed/**
            artifacts/otp-megaco-original/**
            artifacts/otp-megaco-managed/**
            artifacts/otp-testanalysis-original/**
            artifacts/otp-testanalysis-managed/**
            artifacts/otp-platform-original/**
            artifacts/otp-platform-managed/**
            artifacts/otp-gui-original/**
            artifacts/otp-gui-managed/**
            artifacts/otp-apply-original/**
            artifacts/library477/permanent/**
            artifacts/otp-float-store-original/**
            artifacts/otp-closed-wait-original/**
            artifacts/otp-frame-original/**
            artifacts/library481/permanent/**
            artifacts/otp-comparison-original/**
            artifacts/otp-receive-original/**
            artifacts/otp-receive-length-original/**
            artifacts/library484/permanent/**
            artifacts/otp-library-consumer-*/artifacts/otp-megaco-managed/receive484/**
            artifacts/library483/permanent/**
            artifacts/otp-library-consumer-*/artifacts/otp-gui-managed/receive483/**
            artifacts/library482/permanent/**
            artifacts/library480/permanent/**
            artifacts/library479/permanent/**
            artifacts/otp-library-consumer-*/completion.json
            artifacts/preprocessing-disabled.log
            artifacts/library376-official-compiler/ci-provider-ready.json
            artifacts/runtime-profile.log
            artifacts/library437-ddll-same-host-original1/**
            artifacts/library442-ets-same-host-original1/**
            artifacts/library442-ets-compressed-permanent/**
            artifacts/library442-ets-compressed-mutations-permanent/**
            artifacts/library453-re-unicode-permanent/**
            artifacts/library453-unicode-cancellation/**
            artifacts/library453-kernel-permanent/**
            artifacts/port-pump-teardown442/**
            artifacts/library404-permanent-comparisons/**
            artifacts/library416-ddll-error*/**
            artifacts/library420-ets-info*/**
            artifacts/library436-ets-counter-hints-permanent/**
            artifacts/halt-subprocess-host-results.json
            artifacts/halt-subprocess-cases/**/process-raw-evidence.json
            artifacts/halt-subprocess-cases/**/probe-evidence.json
            artifacts/halt-subprocess-cases/**/requested-clr.dmp.identity.json
            artifacts/halt-subprocess-cases/**/process-stdout.raw
            artifacts/halt-subprocess-cases/**/process-stderr.raw
