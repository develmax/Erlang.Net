name: Raw Unix NIF filename original observation
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact published source head reviewed for this original observation
        type: string
        required: true
      source_manifest_sha256:
        description: Reviewed raw Unix observer source manifest at that head
        type: string
        required: true
permissions:
  contents: read
jobs:
  raw-unix-filename:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      RAW_MANIFEST_SHA256: ${{ inputs.source_manifest_sha256 }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      PYTHONDONTWRITEBYTECODE: '1'
      ERLC_USE_SERVER: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact reviewed source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          python3 -B tools/Native/Erlang.NifUnixFilenameObservations/verify-source.py --expected-head "$GITHUB_SHA" --source-manifest-sha256 "$RAW_MANIFEST_SHA256"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build pinned original with accepted owned build helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/raw-unix-otp-source
          test "$(git -C artifacts/raw-unix-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
          python3 -B tools/Runtime/Erlang.SchedulerAffinityOriginalObservations/build-original.py --repository "$GITHUB_WORKSPACE" --manifest-sha256 AEBBA0D2DCF97E1248CA38407E8EBE628EB08F9EA4D13F48EC0C83A7A0364E61 --expected-head "$GITHUB_SHA" --otp-source "$GITHUB_WORKSPACE/artifacts/raw-unix-otp-source" --prefix "$GITHUB_WORKSPACE/artifacts/raw-unix-otp" --output "$GITHUB_WORKSPACE/artifacts/raw-unix-runtime-build"
      - name: Build managed driver and compare owned echo image against pinned original
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/Native/Erlang.NifNativeBackend -m:1
          receipt="$GITHUB_WORKSPACE/artifacts/raw-unix-runtime-build/build-receipt.json"
          receipt_sha=$(python3 -c 'import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest().upper())' "$receipt")
          python3 -B tools/Native/Erlang.NifUnixFilenameObservations/observe.py --otp-root "$GITHUB_WORKSPACE/artifacts/raw-unix-otp" --otp-source "$GITHUB_WORKSPACE/artifacts/raw-unix-otp-source" --build-receipt "$receipt" --approved-build-receipt-sha256 "$receipt_sha" --expected-head "$GITHUB_SHA" --source-manifest-sha256 "$RAW_MANIFEST_SHA256" --sdk-driver "$GITHUB_WORKSPACE/tools/Native/Erlang.NifNativeBackend/bin/Debug/net10.0/Erlang.NifNativeBackend.dll" --output "$GITHUB_WORKSPACE/artifacts/raw-unix-observation"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-unix-filename
          path: |
            artifacts/raw-unix-runtime-build
            artifacts/raw-unix-observation/*.json
            artifacts/raw-unix-observation/*.stdout
            artifacts/raw-unix-observation/*.stderr
            artifacts/raw-unix-observation/*.etf
            artifacts/raw-unix-observation/*/completion.json
            artifacts/raw-unix-observation/*/returned.etf
