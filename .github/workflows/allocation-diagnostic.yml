name: Linux final poll custody and original descriptor comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: poll-final558-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-final-poll-custody:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows
            src/Runtime
            src/Compiler
            src/Otp/Managed
            src/Otp/Original/Foundation/Erlang.Otp.Erts.Beam
            tools/Native/Erlang.PortProbe
            tools/Validation/Erlang.Differential
            tools/Validation/Erlang.DescriptorPollVmValidation
            tools/Validation/Erlang.DescriptorPollIntegratedValidation
            tools/Validation/Erlang.DescriptorPollFdValidation
          persist-credentials: false
      - name: Verify exact final source tree and complete materialized compile inputs
        run: python3 -B tools/Validation/Erlang.DescriptorPollVmValidation/verify-ci.py
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Require exact CLR profile
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 10.0.11 '; then
            curl --fail --location --retry 2 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/poll-final558-dotnet-install.sh"
            bash "$RUNNER_TEMP/poll-final558-dotnet-install.sh" --runtime dotnet --version 10.0.11 --install-dir "$DOTNET_ROOT" --no-path
          fi
          dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 10.0.11 '
      - name: Collect all54 final-source controls with one original provider
        shell: bash
        run: |
          python3 -B tools/Validation/Erlang.DescriptorPollVmValidation/run-ci.py --expected-head "$GITHUB_SHA" --expected-src-tree 773dc5159bf5ce42fa5c37bc2d2df09f8ffab68c --output artifacts/poll-final1589
      - name: Always retain all actual outcomes, inputs and preparation logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: descriptor-poll-final558-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/poll-final1589/*.json
            artifacts/poll-final1589/*.log
