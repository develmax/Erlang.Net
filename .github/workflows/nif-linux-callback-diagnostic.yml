name: Controlled base namespace copied-image reviewed-only experiment
on:
  workflow_dispatch:
    inputs:
      expected_head:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose-reused-own-native-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      SOURCE_PLAN: .validation/nif-callback361-source-plan.json
      SOURCE_PLAN_SHA: 83667FC235724A7E618C6DA8AAE36FF6BCCA0C4616E1C1AE83E1BA1F25A43995
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify executing code head and reuse exact parent owned artifact
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B tools/Erlang.NifLinuxCallbackObservations/reuse.py
      - name: Try bounded debugger installation on this ephemeral runner
        shell: bash
        run: |
          if ! command -v gdb >/dev/null; then timeout 120s sudo apt-get install --yes --no-install-recommends gdb || echo "Debugger unavailable; bounded triage dump fallback retained"; fi
      - name: Build explicit four-file base-copy runtime experiment
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet build tools/Erlang.NifLinuxCallbackFocus/Erlang.NifLinuxCallbackFocus.csproj --disable-build-servers -m:1 -nr:false --nologo
          cp artifacts/linux-callback17/bridge/Erlang.NifBridge.so tools/Erlang.NifLinuxCallbackFocus/bin/Debug/net10.0/Erlang.NifBridge.so
      - name: Build managed-only discriminator from identical guest source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/Erlang.NifLinuxManagedControlFocus/Erlang.NifLinuxManagedControlFocus.csproj -c Release --disable-build-servers -m:1 -nr:false --nologo
      - name: Execute independent managed-only map construction control
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxManagedControlObservations/run.py \
            --admission "$GITHUB_WORKSPACE/artifacts/linux-callback17/bridge/admission.json" \
            --approved-admission-sha256 0711868322C3A608AE6B2FB249D42D05C4C420A5B842D11532577F0C00A00CD3 \
            --expected-head "$GITHUB_SHA" \
            --focus "$GITHUB_WORKSPACE/tools/Erlang.NifLinuxManagedControlFocus/bin/Release/net10.0/Erlang.NifLinuxManagedControlFocus.dll" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-managed-control"
      - name: Execute traced full17 on reviewed route with distinct copied-image base namespace after preflights and joined-thread GC
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxCallbackObservations/diagnose.py --source-plan "$GITHUB_WORKSPACE/$SOURCE_PLAN" --source-plan-sha256 "$SOURCE_PLAN_SHA"
      - name: Compare reviewed34 rows against exact reused original artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxCallbackObservations/compare-experiment.py --capture-root "$GITHUB_WORKSPACE/artifacts/linux-callback-base-copy-experiment" \
            --approved-size-completion-sha256 "$(sha256sum artifacts/linux-callback17/size-original/completion.json | cut -d' ' -f1)" \
            --approved-reference-completion-sha256 "$(sha256sum artifacts/linux-callback17/reference-original/completion.json | cut -d' ' -f1)" \
            --approved-sdk-completion-sha256 "$(sha256sum artifacts/linux-callback-base-copy-experiment/sdk/completion.json | cut -d' ' -f1)" \
            --approved-admission-sha256 "$(sha256sum artifacts/linux-callback17/bridge/admission.json | cut -d' ' -f1)" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-callback-base-copy-experiment/comparison.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-callback-base-copy-experiment
          path: |
            artifacts/linux-callback-base-copy-experiment/**
            artifacts/linux-callback17/reuse-proof.json
            artifacts/linux-managed-control/**
