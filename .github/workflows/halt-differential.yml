name: Pinned OTP halt raw subprocess track
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  halt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build exact pinned original for fresh halt processes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/halt-otp-source
          test "$(git -C artifacts/halt-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
          cd artifacts/halt-otp-source
          ./configure --prefix="$GITHUB_WORKSPACE/artifacts/halt-otp-oracle" --without-javac --without-wx --without-odbc --without-debugger --without-observer --without-et
          make -j2
          make install
      - name: Run predeclared raw halt contracts in fresh original VMs
        shell: bash
        run: |
          set -euo pipefail
          export DOTNET_PROCESSOR_COUNT=2
          export MSBUILDDISABLENODEREUSE=1
          export DOTNET_GCConserveMemory=7
          dotnet build tools/Runtime/Erlang.HaltProbe -m:1 --disable-build-servers
          dotnet run --project tools/Runtime/Erlang.HaltProbe --no-build -- --halt "$GITHUB_WORKSPACE/artifacts/halt-otp-oracle/bin/erl" artifacts/halt-native.json artifacts/halt-native-cases
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: halt-native-raw
          path: |
            artifacts/halt-native.json
            artifacts/halt-native.json.predeclared.json
            artifacts/halt-native-cases
