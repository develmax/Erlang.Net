name: Controlled NEWLM host-thread and ordinary NIF loading validation
on:
  workflow_dispatch:
    inputs:
      expected_head:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  diagnose-reused-own-native-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      SOURCE_PLAN: .validation/nif-callback361-source-plan.json
      SOURCE_PLAN_SHA: 83667FC235724A7E618C6DA8AAE36FF6BCCA0C4616E1C1AE83E1BA1F25A43995
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify executing code head and reuse exact parent owned artifact
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_HEAD" = "$GITHUB_SHA"
          test "$(git --no-optional-locks rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B tools/Erlang.NifLinuxCallbackObservations/reuse.py
      - name: Try bounded debugger installation on this ephemeral runner
        shell: bash
        run: |
          if ! command -v gdb >/dev/null; then timeout 120s sudo apt-get install --yes --no-install-recommends gdb || echo "Debugger unavailable; bounded triage dump fallback retained"; fi
      - name: Build only the owned host-thread bridge with retained original headers
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxCallbackObservations/prepare-pthread.py
      - name: Build NEWLM host-thread provider control
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet build tools/Erlang.NifLinuxCallbackFocus/Erlang.NifLinuxCallbackFocus.csproj --disable-build-servers -m:1 -nr:false --nologo
          cp artifacts/linux-pthread-bridge/Erlang.NifBridge.so tools/Erlang.NifLinuxCallbackFocus/bin/Debug/net10.0/Erlang.NifBridge.so
      - name: Build managed-only discriminator from identical guest source
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/Erlang.NifLinuxManagedControlFocus/Erlang.NifLinuxManagedControlFocus.csproj -c Release --disable-build-servers -m:1 -nr:false --nologo
      - name: Execute independent managed-only map construction control
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxManagedControlObservations/run.py \
            --admission "$GITHUB_WORKSPACE/artifacts/linux-callback17/bridge/admission.json" \
            --approved-admission-sha256 0711868322C3A608AE6B2FB249D42D05C4C420A5B842D11532577F0C00A00CD3 \
            --expected-head "$GITHUB_SHA" \
            --focus "$GITHUB_WORKSPACE/tools/Erlang.NifLinuxManagedControlFocus/bin/Release/net10.0/Erlang.NifLinuxManagedControlFocus.dll" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-managed-control"
      - name: Build ordinary loading regression focus
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/Erlang.NifOrdinaryLoaderFocus/Erlang.NifOrdinaryLoaderFocus.csproj -c Release --disable-build-servers -m:1 -nr:false --nologo
          cp artifacts/linux-pthread-bridge/Erlang.NifBridge.so tools/Erlang.NifOrdinaryLoaderFocus/bin/Release/net10.0/Erlang.NifBridge.so
      - name: Check ordinary origin, bare-name lookup and missing dependency against native loader
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifOrdinaryLoaderObservations/run.py \
            --expected-head "$GITHUB_SHA" \
            --header-receipt "$GITHUB_WORKSPACE/artifacts/linux-callback17/size-native/native-build-receipt.json" \
            --approved-header-receipt-sha256 "$(sha256sum artifacts/linux-callback17/size-native/native-build-receipt.json | cut -d' ' -f1)" \
            --headers "$GITHUB_WORKSPACE/artifacts/linux-callback17/size-native/headers" \
            --focus "$GITHUB_WORKSPACE/tools/Erlang.NifOrdinaryLoaderFocus/bin/Release/net10.0/Erlang.NifOrdinaryLoaderFocus.dll" \
            --bridge-sha256 "$(sha256sum artifacts/linux-pthread-bridge/Erlang.NifBridge.so | cut -d' ' -f1)" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-ordinary-regressions"
      - name: Check ordinary C++ and POSIX thread destructors
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifOrdinaryLoaderObservations/run.py --thread-destructors \
            --expected-head "$GITHUB_SHA" \
            --header-receipt "$GITHUB_WORKSPACE/artifacts/linux-callback17/size-native/native-build-receipt.json" \
            --approved-header-receipt-sha256 "$(sha256sum artifacts/linux-callback17/size-native/native-build-receipt.json | cut -d' ' -f1)" \
            --headers "$GITHUB_WORKSPACE/artifacts/linux-callback17/size-native/headers" \
            --focus "$GITHUB_WORKSPACE/tools/Erlang.NifOrdinaryLoaderFocus/bin/Release/net10.0/Erlang.NifOrdinaryLoaderFocus.dll" \
            --bridge-sha256 "$(sha256sum artifacts/linux-pthread-bridge/Erlang.NifBridge.so | cut -d' ' -f1)" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-thread-destructors"
      - name: Execute full17 on both routes retaining original NEWLM target paths
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxCallbackObservations/run-pthread.py --source-plan "$GITHUB_WORKSPACE/$SOURCE_PLAN" --source-plan-sha256 "$SOURCE_PLAN_SHA" --approved-admission-sha256 "$(sha256sum artifacts/linux-pthread-bridge/admission.json | cut -d' ' -f1)"
      - name: Verify actual host-provider bindings and joined thread calls
        shell: bash
        run: python3 -B tools/Erlang.NifLinuxCallbackObservations/verify-pthread.py
      - name: Compare all68 rows against exact reused original artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.NifLinuxCallbackObservations/compare.py --capture-root "$GITHUB_WORKSPACE/artifacts/linux-callback-pthread-control" \
            --approved-size-completion-sha256 "$(sha256sum artifacts/linux-callback17/size-original/completion.json | cut -d' ' -f1)" \
            --approved-reference-completion-sha256 "$(sha256sum artifacts/linux-callback17/reference-original/completion.json | cut -d' ' -f1)" \
            --approved-sdk-completion-sha256 "$(sha256sum artifacts/linux-callback-pthread-control/sdk/completion.json | cut -d' ' -f1)" \
            --approved-admission-sha256 "$(sha256sum artifacts/linux-pthread-bridge/admission.json | cut -d' ' -f1)" \
            --output "$GITHUB_WORKSPACE/artifacts/linux-callback-pthread-control/comparison.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-callback-pthread-control
          path: |
            artifacts/linux-callback-pthread-control/**
            artifacts/linux-callback17/reuse-proof.json
            artifacts/linux-managed-control/**
            artifacts/linux-pthread-bridge/**
            artifacts/linux-ordinary-regressions/**
            artifacts/linux-thread-destructors/**
