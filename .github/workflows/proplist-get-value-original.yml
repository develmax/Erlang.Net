name: Original proplists caller and foldr validation only
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed validation branch head
        type: string
        required: true
      source_inputs_sha256:
        description: SHA256 of reviewed corrected family source manifest
        type: string
        required: true
permissions:
  contents: read
jobs:
  original-proplists22:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      SOURCE_INPUTS_SHA256: ${{ inputs.source_inputs_sha256 }}
      ERLC_USE_SERVER: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Admit reviewed family source before expensive preparation
        run: python3 -B tools/Erlang.ProplistFamilyObservations/ci-gates.py admit --head "$EXPECTED_HEAD" --manifest-sha256 "$SOURCE_INPUTS_SHA256"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build parse gate, parse all admitted fixtures and admit collector
        run: python3 -B tools/Erlang.ProplistFamilyObservations/ci-gates.py parse --head "$EXPECTED_HEAD" --manifest-sha256 "$SOURCE_INPUTS_SHA256"
      - name: Clone pinned OTP source once
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/proplists22-otp-source \
            2>&1 | tee artifacts/proplists22-original/clone.log
          test "$(git -C artifacts/proplists22-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
      - name: Build and seal one original OTP installation for all independent groups
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/Erlang.SchedulerAffinityOriginalObservations/build-original.py \
            --repository "$GITHUB_WORKSPACE" --manifest-sha256 4C9A79CD6E8BC18F68316D42B2F30DB171E67A242CA81CA84BB8A022E8BA5BFB \
            --expected-head "$EXPECTED_HEAD" --otp-source "$GITHUB_WORKSPACE/artifacts/proplists22-otp-source" \
            --prefix "$GITHUB_WORKSPACE/artifacts/proplists22-otp" \
            --output "$GITHUB_WORKSPACE/artifacts/proplists22-original/build" \
            2>&1 | tee artifacts/proplists22-original/build.log
      - name: Collect matched-worker proplists, comprehensions and closure witnesses
        shell: bash
        run: |
          set -euo pipefail
          BUILD_RECEIPT="$GITHUB_WORKSPACE/artifacts/proplists22-original/build/build-receipt.json"
          PARSE_GATE="$GITHUB_WORKSPACE/artifacts/proplists22-original/preflight/parse-receipt.json"
          python3 -B tools/Erlang.ProplistFamilyObservations/collect-original-corrected.py \
            --repository "$GITHUB_WORKSPACE" --expected-head "$EXPECTED_HEAD" \
            --source-inputs-sha256 "$SOURCE_INPUTS_SHA256" \
            --parse-gate "$PARSE_GATE" --parse-gate-sha256 "$(sha256sum "$PARSE_GATE" | cut -d ' ' -f 1)" \
            --otp-source "$GITHUB_WORKSPACE/artifacts/proplists22-otp-source" \
            --runtime-root "$GITHUB_WORKSPACE/artifacts/proplists22-otp/lib/erlang" \
            --build-receipt "$BUILD_RECEIPT" --approved-build-receipt-sha256 "$(sha256sum "$BUILD_RECEIPT" | cut -d ' ' -f 1)" \
            --output "$GITHUB_WORKSPACE/artifacts/proplists22-original/capture" \
            2>&1 | tee artifacts/proplists22-original/collection.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: original-proplists22
          path: artifacts/proplists22-original/**
          if-no-files-found: warn
