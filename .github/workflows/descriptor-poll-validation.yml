name: Linux descriptor poll validation
on:
  pull_request:
    paths:
      - 'src/Runtime/Erlang.Runtime.Core/Native/Drivers/Descriptors/**'
      - 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.DescriptorPolling558.cs'
      - 'src/Runtime/Erlang.Runtime.Core/Processes/Context/ProcessRuntime.Sequence*.cs'
      - 'tools/Validation/Erlang.DescriptorPoll*Validation/**'
      - '.github/workflows/descriptor-poll-validation.yml'
      - '.github/validation/descriptor-poll-admission.json'
  workflow_dispatch:
    inputs:
      expected_head:
        description: Reviewed exact commit; must equal workflow checkout
        required: true
        type: string
      expected_src_tree:
        description: Reviewed committed src tree; must match source-plan
        required: true
        type: string
      plan_sha256:
        description: Reviewed literal RAW poll source-plan SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: descriptor-poll-validation
  cancel-in-progress: false
jobs:
  linux-descriptor-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_USE_MSBUILD_SERVER: '0'
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.expected_head }}
      EXPECTED_SRC_TREE: ${{ inputs.expected_src_tree }}
      EXPECTED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows
            .github/validation
            src/Runtime
            src/Compiler
            src/Otp/Managed
            src/Otp/Original/Foundation/Erlang.Otp.Erts.Beam
            tools/Native/Erlang.PortProbe
            tools/Validation/Erlang.Differential
            tools/Validation/Erlang.DescriptorPollVmValidation
            tools/Validation/Erlang.DescriptorPollIntegratedValidation
            tools/Validation/Erlang.DescriptorPollFdValidation
          persist-credentials: false
      - name: Read explicitly reviewed PR admission without resealing any inputs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          admission=json.loads(Path('.github/validation/descriptor-poll-admission.json').read_bytes())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name,key in [('EXPECTED_SRC_TREE','ProductionSourceTree'),('EXPECTED_PLAN_SHA256','RawSourcePlanSha256')]:
                  value=admission[key]
                  assert isinstance(value,str) and len(value)==(40 if key=='ProductionSourceTree' else 64) and all(c in '0123456789abcdefABCDEF' for c in value)
                  output.write(name+'='+value+'\n')
          PY
      - name: Verify exact final source tree and complete materialized compile inputs
        run: python3 -B tools/Validation/Erlang.DescriptorPollVmValidation/verify-ci.py --expected-head "$EXPECTED_HEAD" --expected-src-tree "$EXPECTED_SRC_TREE" --plan-sha256 "$EXPECTED_PLAN_SHA256"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Require exact CLR profile
        shell: bash
        run: |
          set -euo pipefail
          if ! dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 10.0.11 '; then
            curl --fail --location --retry 2 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/poll-final558-dotnet-install.sh"
            bash "$RUNNER_TEMP/poll-final558-dotnet-install.sh" --runtime dotnet --version 10.0.11 --install-dir "$DOTNET_ROOT" --no-path
          fi
          dotnet --list-runtimes | grep -F 'Microsoft.NETCore.App 10.0.11 '
      - name: Collect all54 final-source controls with one original provider
        shell: bash
        run: |
          python3 -B tools/Validation/Erlang.DescriptorPollVmValidation/run-ci.py --expected-head "$EXPECTED_HEAD" --expected-src-tree "$EXPECTED_SRC_TREE" --plan-sha256 "$EXPECTED_PLAN_SHA256" --output artifacts/descriptor-poll-validation
      - name: Always retain all actual outcomes, inputs and preparation logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: descriptor-poll-validation-${{ github.sha }}
          if-no-files-found: error
          path: |
            artifacts/descriptor-poll-validation/*.json
            artifacts/descriptor-poll-validation/*.log
