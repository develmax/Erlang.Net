name: Unmodified OTP-linked NIF on macOS
on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: 'Completed main matrix run containing nif-platform-macos-15'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  original-bundle-on-native-host:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            src/Runtime
            src/Otp/Managed/Erlang.Otp.Stdlib
            src/Otp/Managed/Erlang.Otp.Kernel
            src/Otp/Original/Foundation/Erlang.Otp.Erts.Beam
            tools/Native/Erlang.NifNativeBackend
            tools/Native/Erlang.NifPlatformValidation
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nif-platform-macos-15
          run-id: ${{ inputs.producer_run }}
          github-token: ${{ github.token }}
          path: artifacts/otp-producer
      - name: Execute the original bundle without recompiling or relinking it
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/otp
          test "$(git -C artifacts/otp rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
          (cd artifacts/otp && ./configure --without-javac --without-wx --without-odbc --without-debugger --without-observer --without-et --without-ssl --without-termcap --disable-jit)
          python3 tools/Native/Erlang.NifPlatformValidation/prepare-configured-headers.py --repository . --otp-source artifacts/otp --output artifacts/headers
          python3 tools/Native/Erlang.NifNativeBackend/build-macos-host.py --repository . --otp-include artifacts/headers --otp-source artifacts/otp --dotnet-root "$DOTNET_ROOT" --output artifacts/process-host
          dotnet build tools/Native/Erlang.NifPlatformValidation -m:1
          cp artifacts/otp-producer/native/Erlang.NifBridge.so tools/Native/Erlang.NifPlatformValidation/bin/Debug/net10.0/
          mkdir -p artifacts/nif-binary-compat
          fxr=$(find "$DOTNET_ROOT/host/fxr" -name libhostfxr.dylib | sort -V | tail -1)
          "$PWD/artifacts/process-host/erlang-nif-host" "$fxr" "$DOTNET_ROOT" "$PWD/tools/Native/Erlang.NifPlatformValidation/bin/Debug/net10.0/Erlang.NifNativeBackend.dll" \
            --image artifacts/otp-producer/image/ebin/nif_platform_fixture.beam \
            artifacts/otp-producer/image/original/nif_platform_fixture.so \
            artifacts/nif-binary-compat/managed.etf \
            > artifacts/nif-binary-compat/report.json
          python3 -c 'import json; r=json.load(open("artifacts/nif-binary-compat/report.json")); assert r["Passed"] and r["ProcessHost"] and r["Architecture"] == "Arm64"'
          cp artifacts/process-host/build-receipt.json artifacts/nif-binary-compat/
          cmp artifacts/otp-producer/image/original.etf artifacts/nif-binary-compat/managed.etf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nif-unmodified-macos-bundle
          path: artifacts/nif-binary-compat
