name: Pinned OTP pending and varargs observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-otp-pending-varargs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ERLC_USE_SERVER: 'false'
    steps:
      - uses: actions/checkout@v7
      - name: Build exact original oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          (
            set -x
            git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/nif-pending-otp-source
            test "$(git -C artifacts/nif-pending-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
            cd artifacts/nif-pending-otp-source
            ./configure --prefix="$PWD/observer-install" --without-javac --without-wx --without-odbc --without-debugger --without-observer --without-et
            make -j2
            make install
          ) 2>&1 | tee artifacts/nif-pending-otp-build.log
          python3 - <<'PY_BUILD'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('artifacts/nif-pending-otp-source').resolve()
          prefix = root / 'observer-install'
          files = [prefix / 'bin/erl', prefix / 'bin/erlc', *prefix.glob('lib/erlang/erts-*/bin/beam.smp'), *prefix.glob('lib/erlang/erts-*/bin/erlexec')]
          assert len(files) == 4 and all(path.is_file() for path in files)
          head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          assert head == 'ad05823719d77c8faee87348ea39513d4e2f99c5'
          receipt = {'SourceHead': head, 'ConfiguredPrefix': str(prefix), 'NativeNifCasesExecuted': False, 'Files': [{'Path': str(path.relative_to(root)), 'Bytes': path.stat().st_size, 'Sha256': hashlib.sha256(path.read_bytes()).hexdigest().upper()} for path in files]}
          pathlib.Path('artifacts/nif-pending-otp-build-provenance.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY_BUILD
      - name: Collect thirteen fresh original VM observations
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/artifacts/nif-pending-otp-source/observer-install"
          recipe="$GITHUB_WORKSPACE/tools/Erlang.NifPendingVarargsObservations/original"
          python3 "$recipe/collect.py" \
            --otp-source "$GITHUB_WORKSPACE/artifacts/nif-pending-otp-source" \
            --otp-include "$prefix/lib/erlang/usr/include" \
            --otp-bin "$prefix/bin" \
            --fixture-source "$recipe/fixture.c" \
            --output "$GITHUB_WORKSPACE/artifacts/nif-pending-original-observations" \
            --approved-plan-sha256 EAC7F22640E3233268FD81EC22568A08666BAD5A190A81748DC1A49A1D5B20C0 \
            2>&1 | tee artifacts/nif-pending-original-launch.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nif-pending-original-observations
          path: |
            artifacts/nif-pending-otp-build.log
            artifacts/nif-pending-otp-build-provenance.json
            artifacts/nif-pending-original-launch.log
            artifacts/nif-pending-original-observations/**
