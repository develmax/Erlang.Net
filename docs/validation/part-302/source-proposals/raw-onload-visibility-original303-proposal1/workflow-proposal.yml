name: Pinned raw on-load visibility original observations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-raw-onload-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ERLC_USE_SERVER: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      REVIEWED_ORIGINAL_PLAN_SHA256: REQUIRES_FINAL_SOURCE_SEAL
    steps:
      - uses: actions/checkout@v7
      - name: Build exact pinned original
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p artifacts
          (
            set -x
            git clone --depth 1 --branch OTP-29.1.1 https://github.com/erlang/otp.git artifacts/raw-onload-otp-source
            test "$(git -C artifacts/raw-onload-otp-source rev-parse HEAD)" = ad05823719d77c8faee87348ea39513d4e2f99c5
            cd artifacts/raw-onload-otp-source
            ./configure --prefix="$PWD/observer-install" --without-javac --without-wx --without-odbc --without-debugger --without-observer --without-et
            make -j2
            make install
          ) 2>&1 | tee artifacts/raw-onload-original-build.log
          python3 - <<'PY_BUILD'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('artifacts/raw-onload-otp-source').resolve()
          prefix = root / 'observer-install'
          files = [prefix / 'bin/erl', prefix / 'bin/erlc', *prefix.glob('lib/erlang/erts-*/bin/beam.smp'), *prefix.glob('lib/erlang/erts-*/bin/erlexec')]
          assert len(files) == 4 and all(path.is_file() for path in files)
          head = subprocess.check_output(['git', '-C', str(root), 'rev-parse', 'HEAD'], text=True).strip()
          assert head == 'ad05823719d77c8faee87348ea39513d4e2f99c5'
          receipt = {'SourceHead': head, 'ConfiguredPrefix': str(prefix), 'OriginalCasesExecuted': False, 'NativeFixtureUsed': False,
                     'HarnessCommit': os.environ['GITHUB_SHA'], 'RunId': os.environ['GITHUB_RUN_ID'], 'RunAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'Job': os.environ['GITHUB_JOB'],
                     'Files': [{'Path': str(path.relative_to(root)), 'Bytes': path.stat().st_size, 'Sha256': hashlib.sha256(path.read_bytes()).hexdigest().upper()} for path in files]}
          pathlib.Path('artifacts/raw-onload-original-build-provenance.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY_BUILD
      - name: Verify raw process capture controls
        shell: bash
        run: |
          set -euo pipefail
          recipe="$GITHUB_WORKSPACE/tools/Erlang.RawOnLoadVisibilityObservations/original"
          python3 "$recipe/check_process_capture.py" "$GITHUB_WORKSPACE/artifacts/raw-onload-capture-controls" \
            2>&1 | tee artifacts/raw-onload-capture-controls-launch.log
      - name: Collect nine fresh original VM cases
        shell: bash
        run: |
          set -euo pipefail
          recipe="$GITHUB_WORKSPACE/tools/Erlang.RawOnLoadVisibilityObservations/original"
          prefix="$GITHUB_WORKSPACE/artifacts/raw-onload-otp-source/observer-install"
          python3 "$recipe/collect.py" \
            --otp-source "$GITHUB_WORKSPACE/artifacts/raw-onload-otp-source" \
            --otp-bin "$prefix/bin" \
            --approved-plan-sha256 "$REVIEWED_ORIGINAL_PLAN_SHA256" \
            --output "$GITHUB_WORKSPACE/artifacts/raw-onload-original-observations" \
            2>&1 | tee artifacts/raw-onload-original-launch.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: raw-onload-original-nine-observations
          path: |
            artifacts/raw-onload-original-build.log
            artifacts/raw-onload-original-build-provenance.json
            artifacts/raw-onload-capture-controls/**
            artifacts/raw-onload-capture-controls-launch.log
            artifacts/raw-onload-original-launch.log
            artifacts/raw-onload-original-observations/**
